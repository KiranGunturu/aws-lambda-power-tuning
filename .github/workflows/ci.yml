name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tools
        run: pip install cfn-lint shellcheck-py -r tests/requirements.txt
      - name: Lint CloudFormation
        run: cfn-lint --ignore-checks W3002 -- infrastructure/template.yaml
      - name: Lint shell scripts
        run: shellcheck -S warning scripts/*.sh
      - name: Unit tests
        run: python -m pytest -q tests
